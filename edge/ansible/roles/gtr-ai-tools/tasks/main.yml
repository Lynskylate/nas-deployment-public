---
- name: Verify required variables
  ansible.builtin.assert:
    that:
      - gtr_ai_user is defined
      - raft_computer_install_url is defined
      - raft_computer_project is defined
      - raft_computer_project | length > 0
      - raft_computer_machine is defined
      - raft_computer_machine | length > 0
    fail_msg: "gtr-ai-tools requires gtr_ai_user and Raft Computer connection settings"

- name: Gather target AI user passwd entry
  ansible.builtin.getent:
    database: passwd
    key: "{{ gtr_ai_user }}"

- name: Set target AI user facts
  ansible.builtin.set_fact:
    gtr_ai_user_uid: "{{ ansible_facts.getent_passwd[gtr_ai_user][1] }}"
    gtr_ai_user_gid: "{{ ansible_facts.getent_passwd[gtr_ai_user][2] }}"

- name: Ensure npm and npx are available
  ansible.builtin.command: "{{ item }} --version"
  loop:
    - node
    - npm
    - npx
  register: gtr_ai_node_tool_versions
  changed_when: false

- name: Install pinned AI coding CLIs globally
  ansible.builtin.shell: |
    set -euo pipefail
    root="$(npm root -g)"
    package_name="{{ item.name }}"
    package_version="{{ item.version }}"
    if node - "$root" "$package_name" "$package_version" <<'NODE'
    const path = require("path");
    const [root, packageName, packageVersion] = process.argv.slice(2);
    try {
      const pkg = require(path.join(root, packageName, "package.json"));
      process.exit(pkg.version === packageVersion ? 0 : 1);
    } catch {
      process.exit(1);
    }
    NODE
    then
      echo "${package_name}@${package_version} already installed"
    else
      npm install -g "${package_name}@${package_version}" --registry=https://registry.npmmirror.com
    fi
  args:
    executable: /bin/bash
  loop: "{{ gtr_ai_npm_global_packages }}"
  register: gtr_ai_npm_install
  changed_when: "'already installed' not in gtr_ai_npm_install.stdout"

- name: Verify AI coding CLI binaries
  ansible.builtin.command: "{{ item.bin }} --version"
  loop: "{{ gtr_ai_npm_global_packages }}"
  register: gtr_ai_cli_versions
  changed_when: false

- name: Ensure AI config directories exist
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: "{{ gtr_ai_user }}"
    group: "{{ gtr_ai_user }}"
    mode: "{{ item.mode }}"
  loop: "{{ gtr_ai_config_dirs }}"

- name: Check controller config files
  ansible.builtin.stat:
    path: "{{ item.src }}"
  delegate_to: localhost
  become: false
  loop: "{{ gtr_ai_config_files }}"
  loop_control:
    label: "{{ item.src }}"
  register: gtr_ai_controller_config_stats

- name: Copy WSL AI tool config files to GTR
  ansible.builtin.copy:
    src: "{{ item.item.src }}"
    dest: "{{ item.item.dest }}"
    owner: "{{ gtr_ai_user }}"
    group: "{{ gtr_ai_user }}"
    mode: "{{ item.item.mode }}"
  loop: "{{ gtr_ai_controller_config_stats.results }}"
  loop_control:
    label: "{{ item.item.dest }}"
  when: item.stat.exists
  no_log: "{{ item.item.secret | default(false) }}"

- name: Enable lingering for AI user systemd services
  ansible.builtin.command: "loginctl enable-linger {{ gtr_ai_user }}"
  changed_when: false

- name: Ensure AI user systemd manager is started
  ansible.builtin.systemd:
    name: "user@{{ gtr_ai_user_uid }}.service"
    state: started

- name: Stop and disable obsolete Slock user service
  ansible.builtin.shell: |
    systemctl --user disable --now slock-ai-daemon.service 2>/dev/null || true
    systemctl --user daemon-reload
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ gtr_ai_user }}"
  environment:
    HOME: "{{ gtr_ai_home }}"
    XDG_RUNTIME_DIR: "/run/user/{{ gtr_ai_user_uid }}"
  changed_when: false

- name: Remove obsolete Slock user service definition
  ansible.builtin.file:
    path: "{{ gtr_ai_home }}/.config/systemd/user/slock-ai-daemon.service"
    state: absent
  notify: Reload AI user systemd manager

- name: Remove obsolete Slock daemon configuration
  ansible.builtin.file:
    path: "{{ gtr_ai_home }}/.config/slock-ai"
    state: absent

- name: Install Raft Computer from the official installer
  ansible.builtin.shell: |
    set -euo pipefail
    curl -fsSL {{ raft_computer_install_url | quote }} | sh
  args:
    executable: /bin/bash
  become: true
  become_user: "{{ gtr_ai_user }}"
  environment:
    HOME: "{{ gtr_ai_home }}"
    RAFT_COMPUTER_NO_MODIFY_PATH: "1"
  changed_when: true

- name: Verify Raft Computer binary is installed
  ansible.builtin.command: "{{ raft_computer_binary }} --version"
  become: true
  become_user: "{{ gtr_ai_user }}"
  register: raft_computer_version
  changed_when: false

- name: Connect Raft Computer to the configured project and machine
  ansible.builtin.command:
    argv:
      - "{{ raft_computer_binary }}"
      - setup
      - "/{{ raft_computer_project }}"
      - --machine
      - "{{ raft_computer_machine }}"
      - --yes
  become: true
  become_user: "{{ gtr_ai_user }}"
  environment:
    HOME: "{{ gtr_ai_home }}"
  register: raft_computer_setup
  changed_when: false
  no_log: true

- name: Display AI tool deployment summary
  ansible.builtin.debug:
    msg:
      - "Installed CLI versions: {{ gtr_ai_cli_versions.results | map(attribute='stdout') | list }}"
      - "Raft Computer version: {{ raft_computer_version.stdout }}"
      - "Raft Computer is connected to /{{ raft_computer_project }} on machine {{ raft_computer_machine }}"
      - "Config source: {{ gtr_ai_controller_home }}"
