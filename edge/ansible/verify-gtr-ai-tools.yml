---
- name: Verify AI coding tools and Raft Computer on GTR
  hosts: gtr_core
  become: true

  tasks:
    - name: Gather target AI user passwd entry
      ansible.builtin.getent:
        database: passwd
        key: "{{ gtr_ai_user | default('lynskylate') }}"

    - name: Set target AI user facts
      ansible.builtin.set_fact:
        verify_gtr_ai_user: "{{ gtr_ai_user | default('lynskylate') }}"
        verify_gtr_ai_home: "/home/{{ gtr_ai_user | default('lynskylate') }}"
        verify_gtr_ai_uid: "{{ ansible_facts.getent_passwd[gtr_ai_user | default('lynskylate')][1] }}"

    - name: Verify CLI binaries
      ansible.builtin.command: "{{ item }} --version"
      loop:
        - claude
        - codex
        - opencode
      register: verify_gtr_ai_cli_versions
      changed_when: false

    - name: Verify config files exist
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - "{{ verify_gtr_ai_home }}/.claude/settings.json"
        - "{{ verify_gtr_ai_home }}/.codex/config.toml"
        - "{{ verify_gtr_ai_home }}/.codex/auth.json"
        - "{{ verify_gtr_ai_home }}/.config/opencode/opencode.jsonc"
      register: verify_gtr_ai_config_stats

    - name: Assert config files exist
      ansible.builtin.assert:
        that:
          - item.stat.exists
        fail_msg: "Missing config file: {{ item.item }}"
        quiet: true
      loop: "{{ verify_gtr_ai_config_stats.results }}"
      loop_control:
        label: "{{ item.item }}"

    - name: Verify Raft Computer is installed
      ansible.builtin.command: "{{ verify_gtr_ai_home }}/.local/bin/raft-computer --version"
      become_user: "{{ verify_gtr_ai_user }}"
      register: verify_raft_computer_version
      changed_when: false

    - name: Inspect Raft Computer connection status
      ansible.builtin.command: "{{ verify_gtr_ai_home }}/.local/bin/raft-computer status"
      become_user: "{{ verify_gtr_ai_user }}"
      environment:
        HOME: "{{ verify_gtr_ai_home }}"
      register: verify_raft_computer_status
      changed_when: false
      no_log: true

    - name: Assert Raft Computer is connected to the configured machine
      ansible.builtin.assert:
        that:
          - "(raft_computer_machine | default('44324695-06ed-46d6-a4bc-3703c5c37a6c')) in verify_raft_computer_status.stdout"
        fail_msg: "Raft Computer is not connected to the configured machine"
        quiet: true

    - name: Display verification summary
      ansible.builtin.debug:
        msg:
          - "CLI versions: {{ verify_gtr_ai_cli_versions.results | map(attribute='stdout') | list }}"
          - "Raft Computer version: {{ verify_raft_computer_version.stdout }}"
          - "Raft Computer is connected to machine {{ raft_computer_machine | default('44324695-06ed-46d6-a4bc-3703c5c37a6c') }}"
